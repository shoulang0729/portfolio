name: KV Resync

# アプリ KV のウォッチリスト valuation を正本 data/valuations.json に同期する（#652 PR1）。
# - valuations.json の push 時に即同期、毎日 23:30 UTC に自己修復（冪等）。
# - Worker 中継口 /watchlist を叩くだけ。API キー・Secrets は使わない（GITHUB_TOKEN は Issue 管理のみ）。
# - 公開リポのログ・サマリ・Issue には KV の本文を出さない（stage・件数・銘柄シンボルのみ）。

on:
  push:
    branches: [main]
    paths: [data/valuations.json]
  schedule:
    - cron: '30 23 * * *'   # 毎日 23:30 UTC（Mulmo 日次バッチの後・自己修復）
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync = 同期（既定） / check = ドリフト検知のみ（PUT しない）'
        type: choice
        options: [sync, check]
        default: sync

concurrency:
  group: kv-resync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 起動コミットではなく最新の main に合わせる

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run kv-resync
        id: run
        env:
          MODE: ${{ inputs.mode || 'sync' }}
        run: |
          set +e
          if [ "$MODE" = "check" ]; then
            OUT=$(node data/scheduler/kv-resync.mjs --json --check)
          else
            MODE=sync
            OUT=$(node data/scheduler/kv-resync.mjs --json)
          fi
          CODE=$?
          set -e
          LINE=$(printf '%s\n' "$OUT" | tail -n 1)
          if ! printf '%s' "$LINE" | jq -e . >/dev/null 2>&1; then
            LINE='{"ok":false,"stage":"no-output","msg":"kv-resync が結果 JSON を出力しませんでした"}'
          fi
          OK=$(printf '%s' "$LINE"     | jq -r '.ok')
          STAGE=$(printf '%s' "$LINE"  | jq -r '.stage // "unknown"')
          DRIFT=$(printf '%s' "$LINE"  | jq -r '.drift // 0')
          SYMS=$(printf '%s' "$LINE"   | jq -r '(.symbols // []) | join(", ")')
          MSG=$(printf '%s' "$LINE"    | jq -r '.msg // ""')

          # check モードの exit 3（ドリフトあり）は失敗扱いにしない（検知のみ）
          if [ "$CODE" -eq 0 ]; then
            RESULT=success
          elif [ "$MODE" = "check" ] && [ "$CODE" -eq 3 ]; then
            RESULT=drift
            echo "::warning::KV に ${DRIFT} 銘柄のドリフト（check モード・PUT していません）: ${SYMS}"
          else
            RESULT=failure
            echo "::error::kv-resync 失敗 stage=${STAGE} exit=${CODE}"
          fi

          {
            echo "result=$RESULT"
            echo "code=$CODE"
            echo "stage=$STAGE"
            echo "drift=$DRIFT"
            echo "symbols=$SYMS"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## KV Resync（mode=${MODE}）"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| result | ${RESULT} |"
            echo "| exit | ${CODE} |"
            echo "| ok | ${OK} |"
            echo "| stage | ${STAGE} |"
            echo "| drift | ${DRIFT} |"
            echo "| symbols | ${SYMS:-—} |"
            echo "| msg | ${MSG} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "mode=${MODE} result=${RESULT} stage=${STAGE} drift=${DRIFT}"

      - name: Ensure kv-resync-failed label exists
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create kv-resync-failed \
            --color D93F0B \
            --description "KV ウォッチリスト同期の失敗（自動管理）" 2>/dev/null || true

      - name: Open / update / close failure issue (idempotent)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.run.outputs.result }}
          STAGE: ${{ steps.run.outputs.stage }}
          DRIFT: ${{ steps.run.outputs.drift }}
          SYMS: ${{ steps.run.outputs.symbols }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --state open --label kv-resync-failed --json number --jq '.[0].number // ""')
          RESULT=${RESULT:-failure}

          if [ "$RESULT" = "failure" ]; then
            TITLE="⚠ KV ウォッチリスト同期（kv-resync）が失敗しました（stage=${STAGE:-unknown}）"
            BODY=$(cat <<EOF
          アプリ KV のウォッチリスト valuation を正本 \`data/valuations.json\` に同期できませんでした。

          - **stage**: ${STAGE:-unknown}
          - **drift 件数**: ${DRIFT:-不明}
          - **銘柄**: ${SYMS:-—}
          - **Run**: ${RUN_URL}

          > このIssueは \`KV Resync\` ワークフローが自動管理しています（同期が成功すると自動クローズ）。
          EOF
          )
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
              echo "Updated failure issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY" --label kv-resync-failed
              echo "Created failure issue"
            fi
          elif [ "$RESULT" = "success" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "✅ kv-resync が成功しました（stage ${STAGE}・${RUN_URL}）。自動クローズします。"
              echo "Closed failure issue #$EXISTING"
            else
              echo "同期OK・対応不要"
            fi
          else
            echo "check モードでドリフト検知（Issue は変更しない）"
          fi

      - name: Fail job on kv-resync failure
        if: steps.run.outputs.result != 'success' && steps.run.outputs.result != 'drift'
        run: exit 1
